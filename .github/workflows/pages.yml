name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Publish only the static site (no tests, no workflow files).
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html sw.js css js assets _site/
          touch _site/.nojekyll
          # Stamp the commit into the build id: invalidates thumbnail + offline caches per deploy.
          BUILD="${GITHUB_SHA::12}"
          sed -i "s/export const BUILD = 'dev';/export const BUILD = '$BUILD';/" _site/js/version.js
          sed -i "s/const BUILD = 'dev';/const BUILD = '$BUILD';/" _site/sw.js
          grep -q "$BUILD" _site/js/version.js && grep -q "$BUILD" _site/sw.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
